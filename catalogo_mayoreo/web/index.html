<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Kubera Mayoreo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Catálogo de mayoreo. Escritorio: tres columnas (categorías · productos · tu pedido). Teléfono: una columna,
   categorías en fichas y el pedido en una barra fija abajo. Un solo aspecto, claro, a propósito: es el diseño
   que entregó Claude Design para las tiendas.
   La página no lleva llaves ni se conecta a ninguna base: lee catalogo.json, guarda el pedido en este
   navegador y lo manda a /api/mayoreo/pedidos, que es quien valida todo otra vez. */
:root{
  --tinta:#15171A; --fondo:#EEEFEA; --papel:#FFFFFF; --suave:#F7F7F4; --claro:#F3F4F1;
  --acento:#C2410C; --acento-2:#7F2906; --enlace:#B23A0B;
  --linea:#D9DBD5; --linea-2:#C9CCC4; --linea-3:#B9BDB4; --gris:#5B6068; --gris-2:#3D4147; --hundido:#DCDED7;
  --ok:#1F6F43; --ok-f:#E3F1E8; --parcial:#8A5A00; --parcial-f:#FCF1D6; --nada:#9F1F1F; --nada-f:#F8E1E1;
  --espera:#1F4E79; --espera-f:#E2ECF5; --vivo:#6FCF97; --foco:#1D4ED8; --velo:rgba(21,23,26,.74);
  --sans:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  color-scheme:light;
}
:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:var(--sans);font-size:15px;line-height:1.4}
a{color:var(--enlace)}a:hover{color:var(--acento-2)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--foco);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.rotulo{margin:0;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gris)}

/* cabecera */
.cab{background:var(--tinta);color:var(--claro)}
.cab-in{max-width:1440px;margin:0 auto;padding-block:14px;padding-inline:32px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 32px}
.marca{display:flex;align-items:center;gap:14px;color:inherit;text-decoration:none}
.marca:hover{color:inherit}
.marca-k{width:36px;height:36px;border-radius:6px;background:var(--acento);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:var(--papel);flex:0 0 auto}
.marca-n{display:flex;flex-direction:column}
.marca-n b{font-weight:800;font-size:18px;letter-spacing:.01em;font-stretch:85%}
.marca-n span{font-size:13px;color:var(--linea-3)}
.cab-d{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;font-size:14px;color:var(--linea-3)}
.cab-d strong{color:var(--claro);font-weight:600}
.pasos{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 20px}
.pasos [aria-current]{color:var(--papel);font-weight:700}

.marco{max-width:1440px;margin:0 auto;padding-block:28px 64px;padding-inline:32px;display:flex;flex-wrap:wrap;align-items:flex-start;gap:28px}
.aviso-demo{flex:1 1 100%;padding:12px 16px;border-radius:10px;background:var(--espera-f);color:var(--espera);font-size:14px;border:1px solid var(--espera)}

/* categorías */
.nav{flex:1 1 232px;max-width:280px;min-width:0;display:flex;flex-direction:column;gap:2px}
.nav .rotulo{margin-bottom:8px}
.nb{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:40px;padding:8px 12px;border:0;border-radius:6px;text-align:left;font-size:15px;background:transparent;color:var(--tinta)}
.nb:hover{background:var(--hundido)}
.nb .mono{font-size:12px;opacity:.8}
.nb.abierta{background:var(--hundido);font-weight:700}
.nb.sel,.nb.sel:hover{background:var(--tinta);color:var(--papel);font-weight:700}
.nsubs{display:flex;flex-direction:column;gap:2px;margin:2px 0 8px 12px;padding-left:10px;border-left:2px solid var(--linea-2)}
.nsubs .nb{min-height:36px;padding:6px 10px;font-size:14px}
.nsubs .nb span:first-child{display:inline-flex;align-items:center;gap:6px}
.nmas{margin-top:6px;min-height:40px;padding:8px 12px;border:1px dashed var(--linea-3);border-radius:6px;background:transparent;font-size:14px;color:var(--gris-2);text-align:left}
.fichas{display:none;flex-direction:column;gap:8px;flex:1 1 100%;min-width:0}
.fichas-f{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.fichas-f::-webkit-scrollbar{display:none}
.ficha{flex:0 0 auto;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--linea-2);background:var(--papel);font-size:14px;white-space:nowrap}
.ficha.sel{border-color:var(--tinta);background:var(--tinta);color:var(--papel);font-weight:600}

/* productos */
.lista{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:20px}
.vista-cab{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.vista-cab h1{margin:0;font-size:clamp(28px,4.2vw,40px);line-height:1.05;font-weight:800;font-stretch:80%;letter-spacing:-.01em}
.migas{margin-bottom:4px;font-size:14px;color:var(--gris)}
.conteo{margin-top:6px;font-size:15px;color:var(--gris-2)}
.busca{display:flex;flex-direction:column;gap:6px;flex:0 1 340px;min-width:220px}
.busca label{font-size:13px;font-weight:600;color:var(--gris-2)}
.busca input{height:44px;padding:0 14px;border:1px solid var(--linea-3);border-radius:8px;background:var(--papel);font-size:15px;width:100%}
.nota{display:flex;gap:10px 16px;align-items:flex-start;padding:14px 16px;background:var(--papel);border:1px solid var(--linea);border-radius:10px;font-size:14px;line-height:1.45;color:var(--gris-2)}
.nota svg{flex:0 0 auto;margin-top:1px}
.nota strong{color:var(--tinta)}
.sub-todo{background:var(--tinta);color:var(--claro);border-radius:12px;padding:22px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 32px}
.sub-todo div{display:flex;flex-direction:column;gap:4px;min-width:0}
.sub-todo .rotulo{color:var(--linea-3);font-size:12px}
.sub-todo b{font-size:26px;font-weight:800;font-stretch:85%;line-height:1.1}
.sub-todo span{font-size:14px;color:var(--linea)}
.b-fuerte{min-height:52px;padding:0 24px;border-radius:8px;border:2px solid var(--acento);background:var(--acento);color:var(--papel);font-size:16px;font-weight:700}
.b-fuerte.on{background:transparent;border-color:var(--claro)}
.mosaico{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.mos{background:var(--papel);border:1px solid var(--linea);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;justify-content:space-between}
.mos.on{border-color:var(--tinta)}
.mos-n{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mos-n b{font-size:15px;line-height:1.25}
.mos-n span,.mos-d{font-size:12px;color:var(--gris)}
.mos-n span{white-space:nowrap}
.mos-b{display:flex;gap:8px}
.b-linea{flex:1 1 auto;min-height:44px;padding:0 14px;border-radius:8px;border:2px solid var(--acento);background:var(--papel);color:var(--acento);font-size:14px;font-weight:700}
.b-linea.on{background:var(--acento);color:var(--papel)}
.mos.on .b-linea{background:var(--tinta);border-color:var(--tinta);color:var(--papel)}
.b-ver{flex:0 0 auto;width:44px;min-height:44px;border-radius:8px;border:1px solid var(--linea-2);background:var(--papel);display:flex;align-items:center;justify-content:center}
.vacio{padding:48px 24px;text-align:center;background:var(--papel);border:1px solid var(--linea);border-radius:12px}
.vacio b{font-size:18px}
.vacio p{margin-top:8px;color:var(--gris)}

.foto{display:block;background-color:var(--fondo);background-repeat:no-repeat}
.sinfoto{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--gris);font-size:14px}
.ver{display:block;padding:0;border:0;background:transparent;cursor:zoom-in;border-radius:8px}

.familia{background:var(--papel);border:1px solid var(--linea);border-radius:12px;padding:20px;display:flex;flex-wrap:wrap;gap:20px}
.fam-foto{flex:0 0 auto;align-self:flex-start}
.fam-foto .foto{width:168px;height:168px;border-radius:8px}
.fam-c{flex:999 1 420px;min-width:0;display:flex;flex-direction:column;gap:14px}
.fam-cab{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px}
.fam-cab h3{margin:4px 0 0;font-size:22px;font-weight:700;line-height:1.2}
.sku{font-family:var(--mono);font-size:12px;color:var(--gris);overflow-wrap:anywhere}
.fam-precio{text-align:right}
.fam-precio b{display:block;font-family:var(--mono);font-size:24px;font-weight:800}
.fam-precio span{font-size:13px;color:var(--gris)}
.ayuda{font-size:14px;color:var(--gris-2)}
.mz-caja{overflow-x:auto}
.mz{display:grid;grid-template-columns:76px repeat(var(--cols),minmax(0,1fr));gap:6px;min-width:calc(76px + var(--cols) * 84px);align-items:stretch}
.mz-fila{display:contents}
.mz-esq{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gris);align-self:end;padding-bottom:4px}
.mz-col{text-align:center;font-weight:700;font-size:15px;padding-bottom:4px}
.mz-color{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;min-width:0;overflow-wrap:anywhere}
.celda,.vari{border-radius:8px;border:2px solid var(--linea-2);background:var(--papel);color:var(--tinta)}
.celda{min-height:64px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.celda .talla{display:none;font-weight:700}
.celda .pz{font-family:var(--mono);font-size:15px;font-weight:700}
.celda .est,.vari .est{font-size:12px}
.celda .otro{font-family:var(--mono);font-size:11px;font-weight:600}
.celda.hueco{border-style:dashed;color:var(--linea-3);font-size:13px}
.celda.on,.vari.on{border-color:var(--acento);background:var(--acento);color:var(--papel)}
.celda.incl,.vari.incl{border-color:var(--tinta);background:var(--tinta);color:var(--papel);cursor:default}
.celda.nop,.vari.nop{background:var(--suave);color:var(--gris);cursor:default}
.vars{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px}
.vari{min-height:56px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left}
.vari .et{font-family:var(--mono);font-size:14px;font-weight:600;overflow-wrap:anywhere;min-width:0}
.vari .dr{display:flex;flex-direction:column;align-items:flex-end;flex:0 0 auto}
.vari .pz{font-family:var(--mono);font-size:14px;font-weight:700}
.fam-pie{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.fam-pie p{font-size:13px;color:var(--gris)}
.incluido{display:inline-flex;align-items:center;min-height:44px;padding:8px 12px;border-radius:8px;background:var(--tinta);color:var(--papel);font-size:14px;font-weight:600}

.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px}
.tj{background:var(--papel);border:2px solid var(--linea);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.tj.on{border-color:var(--acento)}
.tj.incl{border-color:var(--tinta)}
.tj-f{position:relative;background:var(--fondo)}
.tj-f .ver{width:100%;border-radius:0}
.tj-f .foto{width:100%;aspect-ratio:1/1;max-width:100%}
.lote{position:absolute;top:10px;left:10px;padding:4px 10px;border-radius:999px;background:var(--tinta);color:var(--papel);font-family:var(--mono);font-size:12px;font-weight:600;pointer-events:none}
.pc{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;background:var(--espera-f);color:var(--espera);font-size:12px;font-weight:600}
.tj-f .pc{position:absolute;left:10px;bottom:10px;pointer-events:none}
.tj-c{padding:14px;display:flex;flex-direction:column;gap:10px;flex:1 1 auto}
.tj-c h3{margin:4px 0 0;font-size:16px;line-height:1.3;font-weight:600;overflow-wrap:anywhere}
.tj-p{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:auto}
.tj-p span{font-size:13px;color:var(--gris)}
.tj-p b{font-family:var(--mono);font-size:17px;font-weight:700}
.tj .b-linea{font-size:15px}
.nop-t{padding:10px 12px;border-radius:8px;background:var(--claro);font-size:13px;color:var(--gris-2)}
.pie-lista{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-top:8px}
.pie-lista span{font-size:14px;color:var(--gris)}
.b-hueco{min-height:44px;padding:0 22px;border:1px solid var(--tinta);border-radius:8px;background:transparent;font-size:15px;font-weight:600;color:var(--tinta);text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.b-hueco:hover{color:var(--tinta);background:var(--papel)}

/* tu pedido */
.pedido{flex:1 1 320px;max-width:380px;min-width:0;background:var(--papel);border:1px solid var(--linea);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;position:sticky;top:16px;max-height:calc(100vh - 116px)}
.pd-cab{padding:18px 20px;border-bottom:1px solid var(--linea);display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.pd-cab h2{margin:0;font-size:20px;font-weight:800;font-stretch:85%}
.pd-cab span{font-family:var(--mono);font-size:13px;color:var(--gris)}
.pd-scroll{overflow-y:auto;min-height:0}
.pd-vacio{padding:32px 20px;color:var(--gris)}
.pd-t{margin:0;padding:14px 20px 4px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gris)}
.pd-l{list-style:none;margin:0;padding:0}
.pd-l li{padding:10px 20px 14px;border-bottom:1px solid var(--fondo);display:flex;flex-direction:column;gap:6px}
.pd-r{display:flex;justify-content:space-between;gap:12px}
.pd-r b{font-size:14px;font-weight:600;line-height:1.3;overflow-wrap:anywhere;min-width:0}
.pd-m{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:13px;color:var(--gris-2);flex-wrap:wrap}
.pd-s{align-self:flex-end;font-family:var(--mono);font-size:14px;font-weight:600}
.x{flex:0 0 auto;width:32px;height:32px;border:0;border-radius:6px;background:transparent;display:flex;align-items:center;justify-content:center}
.x:hover{background:var(--fondo)}
.pd-mas{padding:10px 20px;font-size:13px;color:var(--gris)}
.pd-pie{padding:18px 20px;display:flex;flex-direction:column;gap:10px;background:var(--suave);border-top:1px solid var(--linea)}
.pd-pie .fila-t{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.pd-of{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--linea)}
.pd-of label{font-weight:700;font-size:15px}
.pd-pie .gr{font-family:var(--mono);font-weight:800;font-size:22px}
.pd-pie small{font-size:12px;color:var(--gris);line-height:1.4}
.b-ir{display:flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border:0;border-radius:8px;background:var(--acento);color:var(--papel);font-weight:700;font-size:16px;text-decoration:none}
.b-ir:hover{background:var(--acento-2);color:var(--papel)}
.b-ir[disabled]{background:var(--linea-3);cursor:default}
.barra{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--tinta);color:var(--papel);padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));align-items:center;justify-content:space-between;gap:12px}
.barra div{display:flex;flex-direction:column;min-width:0}
.barra span{font-size:13px;color:var(--linea-3)}
.barra b{font-family:var(--mono);font-size:18px}

/* revisar y enviar */
.col{flex:1 1 100%;min-width:0;display:flex;flex-direction:column;gap:24px}
.col h1{margin:10px 0 0;font-size:clamp(28px,4.2vw,40px);line-height:1.05;font-weight:800;font-stretch:80%}
.dos{display:flex;flex-wrap:wrap;align-items:flex-start;gap:24px}
.tabla-caja{flex:999 1 640px;min-width:0;background:var(--papel);border:1px solid var(--linea);border-radius:12px;overflow:hidden}
.tabla-caja>div{overflow-x:auto}
table{width:100%;border-collapse:collapse}
.tp{min-width:560px;font-size:15px}
.tp th,.tp td{padding:14px 12px;vertical-align:top}
.tp th:first-child,.tp td:first-child{padding-left:20px}
.tp th:last-child,.tp td:last-child{padding-right:20px}
.tp thead th,.tp .grupo th{padding-block:10px;background:var(--suave);text-align:left;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gris)}
.tp .d{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tp thead .d{font-family:var(--sans)}
.tp tbody tr{border-top:1px solid var(--fondo)}
.tp .prod{display:flex;gap:12px;align-items:flex-start;min-width:0}
.tp .prod .foto,.tp .ico{width:48px;height:48px;border-radius:6px;flex:0 0 auto}
.tp .ico{background:var(--tinta);color:var(--papel);display:flex;align-items:center;justify-content:center}
.tp .prod div{display:flex;flex-direction:column;gap:4px;min-width:0}
.tp .prod b{font-weight:600}
.tp tfoot tr:first-child{border-top:2px solid var(--tinta)}
.tp tfoot th{text-align:left;font-size:15px}
.tp tfoot .gr{font-weight:800;font-size:20px}
.envio{flex:1 1 340px;max-width:420px;min-width:0;background:var(--papel);border:1px solid var(--linea);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:16px}
.campo{display:flex;flex-direction:column;gap:6px}
.campo label{font-weight:700;font-size:15px}
.campo p{font-size:13px;color:var(--gris);line-height:1.4}
.campo input{min-width:0;height:48px;padding:0 14px;border:1px solid var(--linea-3);border-radius:8px;background:var(--papel);font-size:16px}
.campo textarea{min-height:72px;padding:10px 14px;border:1px solid var(--linea-3);border-radius:8px;background:var(--papel);resize:vertical}
.campo label span{font-weight:400;color:var(--gris)}
.dinero{display:flex;align-items:center;border:1px solid var(--linea-3);border-radius:8px;background:var(--papel)}
.dinero:focus-within{outline:3px solid var(--foco);outline-offset:2px}
.dinero span{padding:0 2px 0 14px;font-family:var(--mono);font-size:18px;font-weight:600;color:var(--gris)}
.dinero input{flex:1 1 auto;width:100%;min-width:0;height:48px;padding:0 14px 0 4px;border:0;border-radius:8px;background:transparent;font-family:var(--mono);font-size:18px;font-weight:600;outline:none}
.of-ayuda{font-size:13px;color:var(--gris);line-height:1.4}
.of-ayuda b{color:var(--tinta)}
.flujo{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:8px;background:var(--suave);font-size:14px;line-height:1.45;color:var(--gris-2)}
.flujo strong{font-size:15px;color:var(--tinta)}
.flujo .tenue{color:var(--gris)}
.envio .b-ir{min-height:52px;font-size:17px}
.fino{font-size:12px;color:var(--gris);text-align:center}
.alerta{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--linea);border-left:4px solid var(--nada);border-radius:10px;background:var(--papel)}

/* resultado */

.tr .c-gris{color:var(--gris)}.tr .c-ok{font-weight:700}.tr .c-parcial{font-weight:700;color:var(--parcial)}.tr .c-nada{font-weight:700;color:var(--nada)}.tr .c-espera{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--espera)}

<body>
<header class="cab">
  <div class="cab-in">
    <a class="marca" href="#catalogo" data-a="ir" data-v="catalogo">
      <span class="marca-k" aria-hidden="true">K</span>
      <span class="marca-n"><b>KUBERA MAYOREO</b><span>Catálogo para tiendas autorizadas</span></span>
    </a>
    <div class="cab-d">
      <span id="corte"></span>
      <ol class="pasos" id="pasos" aria-label="Pasos"></ol>
    </div>
  </div>
</header>

<div class="marco cat" id="v-catalogo">
  <nav class="nav" id="nav" aria-label="Categorías"></nav>
  <div class="fichas" id="fichas"></div>
  <main class="lista" id="lista"><div class="vacio"><b>Cargando el catálogo…</b></div></main>
  <aside class="pedido" id="pedido" aria-label="Tu pedido"></aside>
</div>
<div class="marco" id="v-pedido" hidden></div>
<div class="marco" id="v-resultado" hidden></div>
<div class="barra" id="barra" hidden></div>
<dialog class="lupa" id="lupa" aria-label="Foto del producto"></dialog>

<script>
(() => {
'use strict';
const CFG = {modo: 'demo', max: 2000};   // lo real llega de /api/mayoreo/estado
const LS = 'kubera-mayoreo-pedido';
const POR_PAGINA = 48, CAMPOS = ['oferta', 'nombre', 'contacto', 'notas'];
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const num = n => Number(n).toLocaleString('es-MX');
const money = n => '$' + Number(n).toLocaleString('es-MX', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const pzs = n => num(n) + (n === 1 ? ' pieza' : ' pzs');
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const fecha = iso => { const m = /^(\d{4})-(\d\d)-(\d\d)/.exec(iso || ''); return m ? `${+m[3]} ${MESES[+m[2] - 1]} ${m[1]}` : ''; };
const COLORES = {NEG: 'Negro', BLN: 'Blanco', AZL: 'Azul', ROJ: 'Rojo', VER: 'Verde', ROS: 'Rosa', CAF: 'Café', GRI: 'Gris', AMA: 'Amarillo',
  MOR: 'Morado', NAR: 'Naranja', BEI: 'Beige', DOR: 'Dorado', PLA: 'Plata', MUL: 'Multicolor', TRA: 'Transparente', MET: 'Metálico',
  VIN: 'Vino', LIL: 'Lila', TUR: 'Turquesa', CRE: 'Crema', AZLCLA: 'Azul claro', AZLMAR: 'Azul marino', VERCLA: 'Verde claro'};
const TALLAS = ['XXS', 'XS', 'S', 'M', 'L', 'XL', 'XXL', '2XL', 'XXXL', '3XL', '4XL', '5XL', '6XL'];
const ICO = {
  info: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>',
  ok: '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  parcial: '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>',
  nada: '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>',
  reloj: '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  x: '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>',
  ir: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>',
  sinfoto: '<svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>',
  cuadros: '<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>',
  alerta: '<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9A3412" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>'
};

const D = {version: '', corte: '', fotos: null, K: [], P: [], porSku: new Map(), cats: [], items: []};
const E = {vista: 'catalogo', cat: null, sub: null, q: '', limite: POR_PAGINA, verTodas: false,
  sel: new Set(), subs: new Set(), llave: null, oferta: '', nombre: '', contacto: '', notas: '', enviando: false, error: null, res: null, lupa: null};
const hojas = new Set();

/* ── datos ─────────────────────────────────────────────────────────────── */
function ordenTalla(a, b) {
  const ia = TALLAS.indexOf(a), ib = TALLAS.indexOf(b);
  if (ia >= 0 && ib >= 0) return ia - ib;
  return a.localeCompare(b, 'es', {numeric: true});
}
function tituloFamilia(vars) {
  const a = vars[0].t.split(' ');
  let n = a.length;
  for (const v of vars) {
    const b = v.t.split(' ');
    let i = 0;
    while (i < n && i < b.length && norm(a[i]) === norm(b[i])) i++;
    n = i;
    if (!n) break;
  }
  const pal = a.slice(0, n);
  while (pal.length && /^(de|del|para|con|sin|y|en|la|el|los|las|a|color|talla|·|-|,)$/i.test(pal[pal.length - 1])) pal.pop();
  const t = pal.join(' ');
  return pal.length >= 2 && t.length >= 12 ? t : vars[0].t;
}
const esTalla = c => /^\d/.test(c) || TALLAS.includes(c) || /^(CH|MD|GD|XG|UNI|UT)$/.test(c);
function matrizDe(vars) {
  // Una variante «COLOR-…-TALLA» se acomoda en rejilla: el último tramo es la talla y lo demás, el color.
  const partes = vars.map(v => { const a = v.vari.split('-'); return [a.slice(0, -1).join('-'), a[a.length - 1]]; });
  if (!partes.every(x => x[0] && x[1])) return null;
  const filas = [...new Set(partes.map(x => x[0]))], cols = [...new Set(partes.map(x => x[1]))].sort(ordenTalla);
  if (cols.length < 2 || cols.length > 8 || filas.length > 12 || !cols.every(esTalla) || filas.length * cols.length > vars.length * 2) return null;
  const mapa = new Map();
  for (let i = 0; i < vars.length; i++) {
    const llave = partes[i].join('|');
    if (mapa.has(llave)) return null;
    mapa.set(llave, vars[i]);
  }
  return {cols, filas: filas.map(f => ({nombre: f.split('-').map(x => COLORES[x] || x).join(' / '), celdas: cols.map(c => mapa.get(f + '|' + c) || null)}))};
}
function preparar(c) {
  D.version = c.version || '';
  D.corte = c.corte;
  D.fotos = c.fotos;
  D.K = c.K.map(([cat, sub], k) => ({k, cat, sub, n: 0, np: 0, pz: 0, monto: 0}));
  D.P = c.P.map(([sku, t, k, precio, tipo, pz, foto, odoo]) => {
    const partes = sku.split('-'), modelo = partes.slice(0, 2).join('-'), K = D.K[k];
    K.n++;
    if (precio != null) { K.np++; K.pz += pz; K.monto += pz * precio; }
    return {sku, t, k, cat: K.cat, sub: K.sub, precio, tipo, pz, foto, odoo: !!odoo, modelo, vari: partes.slice(2).join('-'), q: norm(sku + ' ' + t)};
  });
  D.porSku = new Map(D.P.map(p => [p.sku, p]));
  const cats = new Map();
  for (const K of D.K) {
    let cat = cats.get(K.cat);
    if (!cat) cats.set(K.cat, cat = {nombre: K.cat, n: 0, subs: []});
    cat.n += K.n;
    cat.subs.push(K);
  }
  D.cats = [...cats.values()].sort((a, b) => b.n - a.n);
  D.cats.forEach(cat => cat.subs.sort((a, b) => b.n - a.n));
  const fam = new Map();
  for (const p of D.P) {
    const llave = p.modelo + '|' + p.k;
    let it = fam.get(llave);
    if (!it) { fam.set(llave, it = {orden: D.items.length, modelo: p.modelo, k: p.k, cat: p.cat, sub: p.sub, vars: []}); D.items.push(it); }
    it.vars.push(p);
  }
  // Dentro de cada subcategoría, primero los modelos con variantes y después los productos sueltos:
  // así las tarjetas quedan juntas en una rejilla y no una sola entre dos bloques.
  D.items.sort((a, b) => a.k - b.k || (a.vars.length === 1) - (b.vars.length === 1) || a.orden - b.orden);
  D.items.forEach((it, i) => { it.id = i; });
  for (const it of D.items) {
    if (it.vars.length === 1) { it.simple = it.vars[0]; continue; }
    it.titulo = tituloFamilia(it.vars);
    it.matriz = matrizDe(it.vars);
    it.foto = (it.vars.find(v => v.foto >= 0) || {foto: -1}).foto;
    it.q = norm(it.modelo + ' ' + it.titulo);
    const cuenta = new Map();
    for (const v of it.vars) if (v.precio != null) cuenta.set(v.precio, (cuenta.get(v.precio) || 0) + 1);
    it.precio = [...cuenta.entries()].sort((a, b) => b[1] - a[1])[0]?.[0] ?? null;
  }
}
const pedible = p => p.precio != null;
const incluido = p => E.subs.has(p.k);
const unidad = it => it.sub === 'Calzado' ? ['par', 'pares'] : ['pieza', 'piezas'];

/* ── el pedido ─────────────────────────────────────────────────────────── */
function resumen() {
  const subs = [...E.subs].map(k => D.K[k]);
  const prods = [...E.sel].map(s => D.porSku.get(s)).filter(p => p && pedible(p) && !incluido(p));
  let pz = 0, monto = 0, spz = 0, smonto = 0, sn = 0;
  for (const p of prods) { pz += p.pz; monto += p.pz * p.precio; }
  for (const K of subs) { spz += K.pz; smonto += K.monto; sn += K.np; }
  return {subs, prods, pz, monto, spz, smonto, sn, piezas: pz + spz, total: monto + smonto, productos: prods.length + sn};
}
function lineas() {
  const r = resumen();
  return D.P.filter(p => pedible(p) && incluido(p)).concat(r.prods);
}
function guardar() {
  try {
    localStorage.setItem(LS, JSON.stringify({corte: D.corte, llave: E.llave, sel: [...E.sel], subs: [...E.subs].map(k => [D.K[k].cat, D.K[k].sub]),
      oferta: E.oferta, nombre: E.nombre, contacto: E.contacto, notas: E.notas}));
  } catch (e) { /* sin almacenamiento: el pedido vive mientras la página esté abierta */ }
}
function recuperar() {
  try {
    const g = JSON.parse(localStorage.getItem(LS) || 'null');
    if (!g) return;
    for (const [cat, sub] of g.subs || []) { const K = D.K.find(x => x.cat === cat && x.sub === sub); if (K) E.subs.add(K.k); }
    for (const s of g.sel || []) { const p = D.porSku.get(s); if (p && pedible(p)) E.sel.add(s); }
    for (const campo of CAMPOS) if (typeof g[campo] === 'string') E[campo] = g[campo].slice(0, 500);
    if (g.corte === D.corte) E.llave = g.llave || null;
  } catch (e) { /* nada que recuperar */ }
}
function cambio() { E.llave = null; E.error = null; guardar(); }
/* La oferta: lo que escribió como cantidad (null si todavía no es una) y la frase que la acompaña. */
function montoOferta() {
  const n = parseFloat(String(E.oferta).replace(/[^0-9.]/g, ''));
  return Number.isFinite(n) && n >= 1 ? Math.round(n * 100) / 100 : null;
}
function ayudaOferta(r) {
  const m = montoOferta();
  if (!r.productos) return 'Primero elige los productos que te interesan.';
  if (m == null) return 'Dinos cuánto ofreces por todo. La revisamos y te respondemos.';
  return `Ofreces <b>${money(m)}</b>: el <b>${(m / r.total * 100).toFixed(1)} %</b> del precio de catálogo.`;
}
function alternarSku(skus, on) {
  for (const s of skus) {
    const p = D.porSku.get(s);
    if (!p || !pedible(p) || incluido(p)) continue;
    if (on) E.sel.add(s); else E.sel.delete(s);
  }
  cambio();
}
function alternarSub(k) {
  if (E.subs.has(k)) E.subs.delete(k);
  else { E.subs.add(k); for (const s of [...E.sel]) if (D.porSku.get(s)?.k === k) E.sel.delete(s); }
  cambio();
}

/* ── fotos ─────────────────────────────────────────────────────────────── */
const urlHoja = h => `fotos/m${String(h).padStart(3, '0')}.jpg?v=${encodeURIComponent(D.version)}`;
function foto(idx, alt) {
  if (idx == null || idx < 0) return `<span class="foto sinfoto" role="img" aria-label="Sin foto">${ICO.sinfoto}<span>Sin foto</span></span>`;
  const f = D.fotos, h = Math.floor(idx / f.por_hoja), n = idx % f.por_hoja, filas = f.por_hoja / f.cols;
  const x = (n % f.cols) / (f.cols - 1) * 100, y = filas > 1 ? Math.floor(n / f.cols) / (filas - 1) * 100 : 0;
  const lista = hojas.has(h);
  return `<span class="foto" role="img" aria-label="${esc(alt)}" style="background-size:${f.cols * 100}% ${filas * 100}%;background-position:${x}% ${y}%;${lista ? `background-image:url(${urlHoja(h)})` : ''}"${lista ? '' : ` data-h="${h}"`}></span>`;
}
function poner(el) {
  const h = +el.dataset.h;
  hojas.add(h);
  el.style.backgroundImage = `url(${urlHoja(h)})`;
  el.removeAttribute('data-h');

      </table></div></section>
      <form class="envio" id="f-envio" aria-label="Enviar oferta" novalidate>
        <div class="campo"><label for="oferta-r">Tu oferta por todo el pedido</label>
          <div class="dinero"><span aria-hidden="true">$</span><input id="oferta-r" data-campo="oferta" type="text" inputmode="decimal" autocomplete="off" placeholder="¿Cuánto ofreces?" value="${esc(E.oferta)}" aria-describedby="oferta-r-ayuda"></div>
          <p class="of-ayuda" id="oferta-r-ayuda" data-ayuda>${ayudaOferta(r)}</p></div>
        <div class="campo"><label for="nombre">Tu nombre o el de tu tienda</label>
          <input id="nombre" data-campo="nombre" type="text" maxlength="80" autocomplete="organization" value="${esc(E.nombre)}"></div>
        <div class="campo"><label for="contacto">Teléfono o WhatsApp <span>(opcional)</span></label>
          <input id="contacto" data-campo="contacto" type="tel" maxlength="80" autocomplete="tel" value="${esc(E.contacto)}" aria-describedby="contacto-ayuda">
          <p id="contacto-ayuda">Para responderte.</p></div>
        <div class="campo"><label for="notas">Notas <span>(opcional)</span></label>
          <textarea id="notas" data-campo="notas" maxlength="500">${esc(E.notas)}</textarea></div>
        <div class="flujo"><strong>Tu oferta pasa a revisión</strong>
          <span>La revisamos y te respondemos. Nada se aparta hasta que la aceptemos; mientras tanto, la existencia puede cambiar.</span>
          <span class="tenue">No se venden piezas sueltas: solo productos completos o subcategorías completas.</span></div>
        ${err ? `<div class="alerta" role="alert">${ICO.alerta}<div><strong>${esc(err.t)}</strong><span>${esc(err.x)}</span>${err.codigo ? `<code>${esc(err.codigo)}</code>` : ''}</div></div>` : ''}
        <button type="submit" class="b-ir" ${E.enviando || demasiado || pausa ? 'disabled' : ''}>${E.enviando ? 'Enviando…' : 'Enviar oferta a revisión'}</button>
        <p class="fino">Si la envías dos veces, no se duplica: recibes el mismo folio.</p>
      </form></div>`}</div>`;
  fotosPendientes($('#v-pedido'));
}
const ERRORES = {
  oferta_invalida: ['Falta tu oferta', 'Escribe cuánto ofreces por todo el pedido, en pesos.'],
  falta_nombre: ['Falta tu nombre', 'Dinos tu nombre o el de tu tienda para poder responderte.'],
  limite_peticiones: ['Demasiados intentos', 'Espera unos minutos y vuelve a enviar. Tu oferta no se duplica.'],
  limite_pedido: ['Pedido demasiado grande', 'Esta oferta pasa del máximo de productos. Divídela en dos.'],
  catalogo_viejo: ['El catálogo cambió', 'Hay un corte de existencias más reciente. Recarga la página y revisa tu pedido antes de enviar la oferta.'],
  pedido_invalido: ['No pudimos leer la oferta', 'Recarga la página y vuelve a armarla. Si sigue pasando, avísale a tu ejecutivo de ventas.'],
  no_disponible: ['Ofertas en pausa', 'Por ahora no estamos recibiendo ofertas por aquí. Escríbele a tu ejecutivo de ventas.'],
  intenta_de_nuevo: ['No pudimos registrar tu oferta', 'Vuelve a enviarla en un minuto: no se duplica.'],
  red: ['No pudimos conectar', 'Revisa tu conexión y vuelve a enviar. Si tu oferta ya había llegado, recibes el mismo folio: no se duplica.']
};
const POR_HTTP = {409: 'catalogo_viejo', 413: 'limite_pedido', 429: 'limite_peticiones', 502: 'intenta_de_nuevo', 503: 'no_disponible'};
function uuid() {
  try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) { /* sin crypto */ }
  return 'k-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12) + Math.random().toString(36).slice(2, 12);
}
function simular(cuerpo) {
  const ls = cuerpo.lineas.map(l => ({sku: l.sku, piezas: l.cantidad, precio: D.porSku.get(l.sku).precio}));
  const total = ls.reduce((a, l) => a + l.piezas * l.precio, 0);
  return {folio: 'DEMO-000000', demo: true, estado: 'en_revision', oferta: cuerpo.oferta, productos: ls.length, piezas: ls.reduce((a, l) => a + l.piezas, 0),
    catalogo_total: Math.round(total * 100) / 100, porcentaje: Math.round(cuerpo.oferta / total * 1000) / 10, lineas: ls};
}
function falta(codigo, campo) {
  const [t, x] = ERRORES[codigo];
  E.error = {t, x};
  pintarRevisar();
  $(campo)?.focus();
}
async function enviar() {
  const ls = lineas();
  if (!ls.length || ls.length > CFG.max || CFG.modo === 'pausa' || E.enviando) return;
  const monto = montoOferta(), nombre = E.nombre.trim();
  if (monto == null) return falta('oferta_invalida', '#oferta-r');
  if (nombre.length < 2) return falta('falta_nombre', '#nombre');
  if (!E.llave) { E.llave = uuid(); guardar(); }
  E.enviando = true; E.error = null;
  pintarRevisar();
  const cuerpo = {llave: E.llave, version: D.version, oferta: monto, nombre, contacto: E.contacto.trim(), notas: E.notas.trim(),
    lineas: ls.map(p => ({sku: p.sku, cantidad: p.pz})), subcategorias: [...E.subs].map(k => ({categoria: D.K[k].cat, subcategoria: D.K[k].sub}))};
  let res;
  try {
    if (CFG.modo === 'demo') { await new Promise(ok => setTimeout(ok, 500)); res = simular(cuerpo); }
    else {
      const r = await fetch('api/mayoreo/ofertas', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(cuerpo)});
      const j = await r.json().catch(() => null);
      if (!r.ok) { const d = j && j.detail && typeof j.detail === 'object' ? j.detail : {}; throw {codigo: d.codigo || POR_HTTP[r.status] || 'pedido_invalido', mensaje: d.mensaje}; }
      res = j;
    }
  } catch (e) {
    const codigoErr = (e && e.codigo) || 'red', [t, x] = ERRORES[codigoErr] || ERRORES.red;
    E.enviando = false; E.error = {t, x: (e && e.mensaje) || x, codigo: codigoErr === 'red' ? '' : codigoErr};
    pintarRevisar();
    return;
  }
  // Ya llegó: hasta aquí se conserva lo elegido. El nombre y el contacto se quedan para la siguiente oferta.
  E.enviando = false; E.res = Object.assign({contacto: cuerpo.contacto}, res); E.llave = null;
  E.sel.clear(); E.subs.clear(); E.oferta = ''; E.notas = '';
  guardar();
  ir('resultado');
}

/* ── resultado ─────────────────────────────────────────────────────────── */
function pintarResultado() {
  const R = E.res;
  if (!R) { ir('catalogo'); return; }
  $('#v-resultado').innerHTML = `${R.demo ? '<p class="aviso-demo"><strong>Demostración.</strong> Esta oferta no se envió: así se verá la respuesta cuando la página esté conectada.</p>' : ''}
    <div class="col"><div><p class="rotulo">Paso 3 · En revisión</p><h1>Oferta recibida</h1></div>
    <section class="res espera" aria-label="En revisión"><span class="pastilla">${ICO.reloj}En revisión</span>
      <div><h2>Recibimos tu oferta</h2><p>La revisamos y te respondemos. Nada se aparta hasta que la aceptemos; mientras tanto, la existencia puede cambiar.</p></div>
      <dl class="folio"><div><dt>Folio</dt><dd>${esc(R.folio)}</dd></div><div><dt>Tu oferta</dt><dd>${money(R.oferta)}</dd></div></dl>
      <div class="res-t"><table class="tr"><thead><tr><th scope="col">SKU</th><th scope="col" class="d">Piezas</th><th scope="col" class="d">Precio de catálogo</th></tr></thead>
        <tbody>${R.lineas.slice(0, 400).map(l => `<tr><td>${esc(l.sku)}</td><td class="d c-ok">${num(l.piezas)}</td><td class="d c-gris">${money(l.precio)}</td></tr>`).join('')}
        ${R.lineas.length > 400 ? `<tr><td colspan="3" class="c-gris">y ${num(R.lineas.length - 400)} productos más</td></tr>` : ''}</tbody></table></div>
      <div class="res-tot"><span>${num(R.productos)} productos · ${num(R.piezas)} piezas</span><b>${money(R.catalogo_total)}</b></div>
      <p class="sig">Tu oferta es el ${Number(R.porcentaje).toFixed(1)} % del precio de catálogo. Guarda tu folio${R.contacto ? `: te respondemos al ${esc(R.contacto)}` : ''}.</p>
      <a class="b-hueco" href="#catalogo" data-a="ir" data-v="catalogo">Volver al catálogo</a></section></div>`;
}

/* ── navegación y eventos ──────────────────────────────────────────────── */
function pintarPasos() {
  const n = {catalogo: 0, pedido: 1, resultado: 2}[E.vista];
  $('#pasos').innerHTML = ['1 · Catálogo', '2 · Tu oferta', '3 · En revisión'].map((t, i) => `<li${i === n ? ' aria-current="step"' : ''}>${t}</li>`).join('');
}
function pintar() {
  $('#v-catalogo').hidden = E.vista !== 'catalogo';
  $('#v-pedido').hidden = E.vista !== 'pedido';
  $('#v-resultado').hidden = E.vista !== 'resultado';
  $('#barra').hidden = E.vista !== 'catalogo';
  pintarPasos();
  if (E.vista === 'catalogo') { pintarNav(); pintarLista(); pintarCarrito(); }
  else if (E.vista === 'pedido') pintarRevisar();
  else pintarResultado();
}
function ir(vista) {
  E.vista = vista;
  if (vista !== 'pedido') E.error = null;
  try { if (location.hash.slice(1) !== vista) history.pushState(null, '', '#' + vista); } catch (e) { /* sin historial */ }
  pintar();
  window.scrollTo(0, 0);
}
function refrescar() {
  if (E.vista === 'catalogo') { pintarNav(); pintarLista(); pintarCarrito(); } else pintar();
  if (E.lupa) pintarLupa();
}
document.addEventListener('click', ev => {
  if (ev.target.id === 'lupa') { cerrarLupa(); return; }                      // clic fuera de la foto
  const b = ev.target.closest('[data-a]');
  if (!b) return;
  const a = b.dataset.a;
  if (b.tagName === 'A') ev.preventDefault();
  if (a === 'cat') { E.cat = b.dataset.c || null; E.sub = null; E.limite = POR_PAGINA; refrescar(); if (!b.closest('.fichas')) window.scrollTo(0, 0); }
  else if (a === 'sub') { const K = D.K[+b.dataset.k]; E.cat = K.cat; E.sub = K.k; E.limite = POR_PAGINA; refrescar(); if (!b.closest('.fichas')) window.scrollTo(0, 0); }
  else if (a === 'vercats') { E.verTodas = !E.verTodas; pintarNav(); }
  else if (a === 'mas') { E.limite += POR_PAGINA; pintarLista(); }
  else if (a === 'sku') { alternarSku([b.dataset.s], !E.sel.has(b.dataset.s)); refrescar(); }
  else if (a === 'fam') { const v = D.items[+b.dataset.m].vars.filter(pedible).map(p => p.sku); alternarSku(v, !v.every(s => E.sel.has(s))); refrescar(); }
  else if (a === 'subt') { alternarSub(+b.dataset.k); refrescar(); }
  else if (a === 'lupa') abrirLupa(b.dataset.s ? {sku: b.dataset.s} : {familia: +b.dataset.m, n: 0});
  else if (a === 'lupa-n') { E.lupa.n = +b.dataset.n; pintarLupa(); }
  else if (a === 'cerrar') cerrarLupa();
  else if (a === 'ir') { if (!b.disabled) ir(b.dataset.v); }
});
let espera = 0;
document.addEventListener('input', ev => {
  if (ev.target.id === 'buscar') { E.q = ev.target.value; E.limite = POR_PAGINA; clearTimeout(espera); espera = setTimeout(() => pintarLista(true), 180); }
  else if (CAMPOS.includes(ev.target.dataset.campo)) {
    // Lo escrito se guarda al momento: recargar la página no lo borra. Cambiarlo hace que sea otra oferta.
    const campo = ev.target.dataset.campo;
    E[campo] = ev.target.value;
    E.llave = null;
    guardar();
    if (campo === 'oferta') { const r = resumen(); document.querySelectorAll('[data-ayuda]').forEach(p => { p.innerHTML = ayudaOferta(r); }); }
  }
});
document.addEventListener('submit', ev => { if (ev.target.id === 'f-envio') { ev.preventDefault(); enviar(); } });
$('#lupa').addEventListener('close', () => { E.lupa = null; });
window.addEventListener('hashchange', () => {
  const v = location.hash.slice(1);
  if (['catalogo', 'pedido', 'resultado'].includes(v) && v !== E.vista) { E.vista = v === 'resultado' && !E.res ? 'catalogo' : v; pintar(); }
});

const leer = (url, defecto) => fetch(url, {cache: 'no-cache'}).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).catch(e => { if (defecto === undefined) throw e; return defecto; });
Promise.all([leer('catalogo.json'), leer('api/mayoreo/estado', null)]).then(([c, est]) => {
  if (est) { CFG.modo = est.ofertas || 'pausa'; CFG.max = est.max_lineas || 2000; }
  preparar(c);
  recuperar();
  $('#corte').innerHTML = `Existencias al <strong>${fecha(D.corte)}</strong>`;
  if (location.hash === '#pedido') E.vista = 'pedido';
  pintar();
}).catch(() => {
  $('#lista').innerHTML = '<div class="vacio"><b>No pudimos cargar el catálogo</b><p>Revisa tu conexión y recarga la página.</p></div>';
});
})();
</script>
</body>
</html>
